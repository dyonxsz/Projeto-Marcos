<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nutrisense</title>
    <link rel="stylesheet" href="login.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <main class="container">
        <form>
            <img src="../assets/nutrisense-removebg-preview.png" alt="logo da Nutrisense" width="360" height="360">
            
            <div class="input-box">
                <input placeholder="Digite seu E-mail" type="email" >
            </div>
            
            <div class="input-box">
                <input placeholder="Digite sua Senha" type="password" >
            </div>
            
            <button type="submit">Entrar</button>
            
            <div class="links-section">
                <a href="#" class="forgot-password">Esqueceu sua senha?</a>
                
                <div class="account-links">
                    <a href="#" class="create-account">Cadastre-se</a>
                    <a href="#" class="create-profissional-account">Cadastro Profissional</a>
                </div>
            </div>
            
            
            <div class="info-section">
                <p class="description">Nutrisense, o seu guia inteligente para uma alimentação equilibrada!</p>
                
                <h2 class="social-title">Conheça nossas redes sociais:</h2>
                
                <div class="social-links">
                    <a href="#" class="social-link"> <i class="fa-brands fa-whatsapp" style="color:black"></i>  </a>
                    <a href="#" class="social-link"> <i class="fa-brands fa-instagram" style="color:black"></i>  </a>
                    <a href="#" class="social-link"> <i class="fa-brands fa-facebook " style="color:black"></i>  </a>
                    <a href="#" class="social-link"> <i class="fa-brands fa-twitter" style="color:black"></i>  </a>
              
                    
                </div>
            </div>
        </form>
    </main>
</body>
</html>
